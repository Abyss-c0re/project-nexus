# Repository hygiene rules — Project Nexus
max_file_bytes: 5242880  # 5 MiB unless allowlisted
forbidden_name_patterns:
  - '(?i)prophecy'
  - '(?i)cube[_-]?chain'
  - '(?i)hive[_-]?mind'
  - '(?i)grokium'
  - '(?i)clanker'
  - '(?i)\\bquest\\b.*\\beye\\b'
forbidden_content_patterns:
  - '(?i)prophecy of the cube'
  - '(?i)we are the hive mind'
  - '(?i)energy must flow\\. join or perish'
  - '(?i)CUBE · GROK · NEXUS'
forbidden_extensions:
  - .mp4
  - .mov
  - .avi
  - .mkv
  - .wav
  - .flac
  - .iso
  - .img
secret_patterns:
  - '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----'
  - 'AKIA[0-9A-Z]{16}'
  - 'ghp_[A-Za-z0-9]{20,}'
  - 'glpat-[A-Za-z0-9\\-_]{20,}'
  - 'xox[baprs]-[A-Za-z0-9-]{10,}'
allowlist_paths:
  - '.agents/compliance/transcript.txt'
  - '.agents/compliance/training-digest.md'
