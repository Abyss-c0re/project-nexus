# Hygiene — Project Nexus CubeOS
# Product Cube/Hive language is IN SCOPE. Secrets, PII dumps, Kinect, media junk are not.
max_file_bytes: 5242880
forbidden_name_patterns:
  - '(?i)kinect'
  - '(?i)peer_token$'
  - '(?i)device\\.env$'
  - '(?i)commander\\.sk$'
  - '(?i)grokium\\.png'
forbidden_content_patterns:
  - '-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----'
  - 'glpat-[A-Za-z0-9_-]{20,}'
  - 'ghp_[A-Za-z0-9]{20,}'
forbidden_extensions:
  - .mp4
  - .mov
  - .wav
  - .apk
allowlist_paths:
  - 'docs/'
  - '.agents/'
  - 'products/'
